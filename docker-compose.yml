services:
  postgres:
    image: postgres:16
    container_name: manipulens-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manipulens

    ports:
      - "5433:5432"

    volumes:
      - manipulens-pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manipulens"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  manipulens-backend:
    build: .
    container_name: manipulens-backend

    ports:
      - "3000:3000"

    volumes:
      - ./logs:/app/logs

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/manipulens

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  manipulens-pgdata: